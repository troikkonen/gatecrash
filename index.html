<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="row">
    <div>SQUAD<b id="squad">0</b></div>
    <div id="lvl" style="pointer-events:auto">LEVEL<b id="level">1</b><small>tap to change</small></div>
    <div id="wpn">WEAPON<img id="wpnI" alt=""><b id="wpnV">Pistol</b></div>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div id="bossName"></div>
</div>
<div id="intro"><img alt=""><div class="k"></div><div class="n"></div><div class="t"></div></div>
<div id="picker" class="panel"><div>Pick a level</div><div id="pick"></div><button class="ghost" onclick="closePicker()">Cancel</button></div>
<div id="win" class="panel"><div class="stars" id="stars"></div><div id="winT">Level cleared</div><small id="winS"></small><button onclick="nextLevel()">Next level</button><button class="ghost" onclick="openPicker()">Pick a level</button></div>
<div id="over" class="panel"><div>Squad wiped out</div><small id="overS"></small><button onclick="retryLevel()">Retry level</button><button class="ghost" onclick="openPicker()">Pick a level</button></div>
<div id="tip">Left lane grows you. Right lane pays big once you bridge it. Crack the glowing rocks. Kill the boss to win.</div>

<div id="title" class="panel">
  <div id="titleArt"><img class="boss" id="titleBoss" src="assets/boss_warden.png" alt=""><img id="titleImg" src="assets/soldier3d.png" alt=""></div>
  <h1>GATECRASH</h1>
  <div class="sub">HOLD THE LANE</div>
  <small id="titleBest">Loading…</small>
  <button id="playBtn" disabled>Play</button>
  <button class="ghost" id="levelsBtn">Levels</button>
</div>
<button id="mute">🔊</button>
<div id="ver">v0901.0037 · <span id="fps">--</span> fps · <button id="qual"></button></div>
